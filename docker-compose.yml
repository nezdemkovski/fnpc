services:
  postgres:
    image: postgres:17-alpine
    container_name: fnpc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: fnpc
      POSTGRES_USER: fnpc
      POSTGRES_PASSWORD: fnpc
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fnpc -d fnpc"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres-data:
