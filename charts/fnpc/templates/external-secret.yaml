apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secret.name }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "fnpc.labels" . | nindent 4 }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: onepassword
  target:
    name: {{ .Values.secret.name }}
    creationPolicy: Owner
  data:
    {{- range .Values.onepassword.modelProviderProperties }}
    - secretKey: {{ . | quote }}
      remoteRef:
        key: {{ $.Values.onepassword.appItem }}
        property: {{ . | quote }}
    {{- end }}
    - secretKey: TELEGRAM_BOT_TOKEN
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: TELEGRAM_BOT_TOKEN
    - secretKey: TELEGRAM_WEBHOOK_SECRET_TOKEN
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: TELEGRAM_WEBHOOK_SECRET_TOKEN
    - secretKey: MASTRA_JWT_SECRET
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: MASTRA_JWT_SECRET
    {{- if .Values.env.studioAuth.enabled }}
    - secretKey: MASTRA_STUDIO_TOKEN
      remoteRef:
        key: {{ .Values.onepassword.appItem }}
        property: MASTRA_JWT_TOKEN
    {{- end }}
    - secretKey: YNAB_ACCESS_TOKEN
      remoteRef:
        key: {{ .Values.onepassword.ynabItem }}
        property: {{ .Values.onepassword.ynabTokenProperty }}
