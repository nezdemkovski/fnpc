{{- if .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "fnpc.fullname" . }}-clickhouse-provisioner
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "fnpc.labels" . | nindent 4 }}
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        {{- include "fnpc.selectorLabels" . | nindent 8 }}
    spec:
      restartPolicy: OnFailure
      containers:
        - name: provision-clickhouse
          image: {{ .Values.clickhouse.provisioner.image | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: CLICKHOUSE_HOST
              value: {{ .Values.clickhouse.host | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.clickhouse.nativePort | quote }}
            - name: CLICKHOUSE_DATABASE
              value: {{ .Values.clickhouse.database | quote }}
            - name: CLICKHOUSE_USERNAME
              value: {{ .Values.clickhouse.username | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: CLICKHOUSE_PASSWORD
            - name: CLICKHOUSE_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "fnpc.fullname" . }}-clickhouse-admin
                  key: CLICKHOUSE_ADMIN_PASSWORD
          command:
            - /bin/sh
            - -ec
            - |
              escaped_password="$(printf "%s" "$CLICKHOUSE_PASSWORD" | sed "s/'/''/g")"
              clickhouse-client \
                --host "$CLICKHOUSE_HOST" \
                --port "$CLICKHOUSE_PORT" \
                --user default \
                --password "$CLICKHOUSE_ADMIN_PASSWORD" \
                --multiquery \
                --query "
                  CREATE DATABASE IF NOT EXISTS ${CLICKHOUSE_DATABASE};
                  CREATE USER IF NOT EXISTS ${CLICKHOUSE_USERNAME} IDENTIFIED BY '${escaped_password}';
                  ALTER USER ${CLICKHOUSE_USERNAME} IDENTIFIED BY '${escaped_password}';
                  GRANT ALL ON ${CLICKHOUSE_DATABASE}.* TO ${CLICKHOUSE_USERNAME};
                "
{{- end }}
