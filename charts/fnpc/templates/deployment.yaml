apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "fnpc.fullname" . }}
  annotations:
    argocd.argoproj.io/sync-wave: "3"
  labels:
    {{- include "fnpc.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "fnpc.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "fnpc.labels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- if .Values.migrations.enabled }}
      initContainers:
        - name: db-migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["node", "migrate.mjs"]
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret.name }}
                  key: {{ .Values.postgres.credentialsSecret.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret.name }}
                  key: {{ .Values.postgres.credentialsSecret.passwordKey }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
      {{- end }}
      containers:
        - name: fnpc
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          env:
            - name: PORT
              value: {{ .Values.env.port | quote }}
            - name: MASTRA_AUTO_DETECT_URL
              value: {{ .Values.env.mastraAutoDetectUrl | quote }}
            - name: MASTRA_HIDE_CLOUD_CTA
              value: {{ .Values.env.mastraHideCloudCta | quote }}
            - name: MASTRA_TELEMETRY_DISABLED
              value: {{ .Values.env.mastraTelemetryDisabled | quote }}
            - name: TELEGRAM_ADAPTER_MODE
              value: {{ .Values.env.telegramAdapterMode | quote }}
            - name: AI_MODEL
              value: {{ .Values.env.aiModel | quote }}
            - name: XAI_REASONING_EFFORT
              value: {{ .Values.env.xaiReasoningEffort | quote }}
            - name: YNAB_PLAN_ID
              value: {{ .Values.env.ynabPlanId | quote }}
            - name: TRADING212_ENV
              value: {{ .Values.env.trading212Environment | quote }}
            {{- if .Values.env.jwtAuth.enabled }}
            - name: MASTRA_JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: MASTRA_JWT_SECRET
            {{- end }}
            {{- if .Values.env.studioAuth.enabled }}
            - name: MASTRA_STUDIO_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: MASTRA_STUDIO_TOKEN
            {{- end }}
            - name: POSTGRES_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret.name }}
                  key: {{ .Values.postgres.credentialsSecret.usernameKey }}
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.postgres.credentialsSecret.name }}
                  key: {{ .Values.postgres.credentialsSecret.passwordKey }}
            - name: POSTGRES_HOST
              value: {{ .Values.postgres.host | quote }}
            - name: POSTGRES_PORT
              value: {{ .Values.postgres.port | quote }}
            - name: POSTGRES_DATABASE
              value: {{ .Values.postgres.database | quote }}
            {{- range .Values.onepassword.appProperties }}
            - name: {{ . | quote }}
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.secret.name }}
                  key: {{ . | quote }}
            {{- end }}
            - name: TELEGRAM_BOT_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: TELEGRAM_BOT_TOKEN
            - name: TELEGRAM_WEBHOOK_SECRET_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: TELEGRAM_WEBHOOK_SECRET_TOKEN
            - name: YNAB_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.secret.name }}
                  key: YNAB_ACCESS_TOKEN
            {{- if .Values.clickhouse.enabled }}
            - name: CLICKHOUSE_URL
              value: {{ .Values.clickhouse.url | quote }}
            - name: CLICKHOUSE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.secretName }}
                  key: username
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.clickhouse.secretName }}
                  key: password
            - name: CLICKHOUSE_RETENTION_DAYS
              value: {{ .Values.clickhouse.retentionDays | quote }}
            {{- end }}
          ports:
            - name: http
              containerPort: {{ .Values.service.targetPort }}
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.readinessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.readinessProbe.periodSeconds }}
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: {{ .Values.livenessProbe.initialDelaySeconds }}
            periodSeconds: {{ .Values.livenessProbe.periodSeconds }}
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
