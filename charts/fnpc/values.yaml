replicaCount: 1

image:
  repository: ghcr.io/nezdemkovski/fnpc
  tag: "0.1.16"
  pullPolicy: IfNotPresent

env:
  port: "4111"
  mastraAutoDetectUrl: "true"
  mastraHideCloudCta: "true"
  telegramAdapterMode: webhook
  aiModel: claude-sonnet-4-6
  auth:
    url: https://auth.nezdemkovski.cloud
    realm: fnpc-studio

migrations:
  enabled: true

secret:
  name: fnpc-env

onepassword:
  appItem: fnpc
  clickhouseItem: fnpc-clickhouse

postgres:
  host: fnpc-postgres-rw.fnpc.svc.cluster.local
  port: "5432"
  database: fnpc
  credentialsSecret:
    name: fnpc-postgres-owner
    usernameKey: username
    passwordKey: password

clickhouse:
  enabled: true
  name: fnpc-clickhouse
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.11.1.558-alpine"
    pullPolicy: IfNotPresent
  url: http://fnpc-clickhouse.fnpc.svc.cluster.local:8123/fnpc
  database: fnpc
  username: fnpc
  secretName: fnpc-clickhouse
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30

service:
  type: ClusterIP
  port: 80
  targetPort: 4111

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  runAsGroup: 1000
  fsGroup: 1000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop:
      - ALL

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
