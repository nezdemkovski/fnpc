replicaCount: 1

image:
  repository: ghcr.io/nezdemkovski/fnpc
  tag: "0.1.2"
  pullPolicy: IfNotPresent

env:
  port: "4111"
  telegramAdapterMode: polling
  aiModel: claude-sonnet-4-6
  auth:
    baseUrl: https://auth.nezdemkovski.cloud/api/fnpc-studio/auth
    jwksUrl: https://auth.nezdemkovski.cloud/api/fnpc-studio/auth/.well-known/jwks.json
    jwtIssuer: https://auth.nezdemkovski.cloud/api/fnpc-studio
    jwtAudience: fnpc-studio,https://auth.nezdemkovski.cloud/api/fnpc-studio

secret:
  name: fnpc-env

onepassword:
  appItem: fnpc
  postgresItem: fnpc-postgres
  clickhouseItem: fnpc-clickhouse

postgres:
  enabled: true
  clusterName: fnpc-postgres
  database: fnpc
  owner: fnpc
  imageName: ghcr.io/cloudnative-pg/postgresql:17.10-system-trixie
  storage:
    storageClass: local-path
    size: 5Gi

clickhouse:
  enabled: true
  name: fnpc-clickhouse
  image:
    repository: clickhouse/clickhouse-server
    tag: "25.11.1.558-alpine"
    pullPolicy: IfNotPresent
  url: http://fnpc-clickhouse.fnpc.svc.cluster.local:8123/fnpc
  database: fnpc
  username: fnpc
  secretName: fnpc-clickhouse
  storage:
    storageClass: local-path
    size: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 1Gi
    limits:
      memory: 2Gi
  readinessProbe:
    initialDelaySeconds: 20
    periodSeconds: 10
  livenessProbe:
    initialDelaySeconds: 60
    periodSeconds: 30

service:
  type: ClusterIP
  port: 80
  targetPort: 4111

resources:
  requests:
    cpu: 100m
    memory: 512Mi
  limits:
    memory: 2Gi

readinessProbe:
  initialDelaySeconds: 20
  periodSeconds: 10

livenessProbe:
  initialDelaySeconds: 60
  periodSeconds: 30
